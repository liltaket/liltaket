        <animateTransform attributeName="transform" type="translate" values="0 0;-720 0" dur="36s" repeatCount="indefinite"/>
      </g>
      <g opacity=".85">
        <path d="M-1440 257C-1260 321-1080 321-900 257s360-64 540 0 360 64 540 0 360-64 540 0 360 64 540 0 360-64 540 0" stroke="url(#waveBlue)" stroke-width="2.2"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;720 0" dur="43s" repeatCount="indefinite"/>
      </g>
    </g>

    <g opacity=".58">
      <path d="M0 74C150 40 270 40 420 74s270 34 420 0 270-34 420 0 270 34 420 0" stroke="#61E7D0" stroke-width="1"/>
      <path d="M0 286c150 34 270 34 420 0s270-34 420 0 270 34 420 0 270-34 420 0" stroke="#958CFF" stroke-width="1"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;1 -3;0 -2;0 0" keyTimes="0;.25;.5;.75;1" keySplines=".4 0 .6 1;.4 0 .6 1;.4 0 .6 1;.4 0 .6 1" calcMode="spline" dur="12s" repeatCount="indefinite"/>
      <rect x="510" y="143" width="420" height="74" rx="37" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="1.2"/>
      <path d="M548 144.5h344c19.3 0 35 15.7 35 35v1.5H513v-1.5c0-19.3 15.7-35 35-35Z" fill="url(#glassShine)"/>
      <path d="M535 202.5c45 8 325 8 370 0" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="1" stroke-linecap="round"/>
      <rect x="511" y="144" width="418" height="72" rx="36" stroke="#FFFFFF" stroke-opacity=".12"/>
      <text x="720" y="194" text-anchor="middle" fill="#F4FAF8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="46" font-weight="600" letter-spacing="1.2">liltaket</text>
