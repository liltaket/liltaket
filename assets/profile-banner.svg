<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D13"/><stop offset=".5" stop-color="#0B111B"/><stop offset="1" stop-color="#10101B"/>
    </linearGradient>
    <linearGradient id="waveMint" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46F0C4" stop-opacity=".05"/><stop offset=".22" stop-color="#46F0C4" stop-opacity=".92"/><stop offset=".53" stop-color="#75DFF5" stop-opacity=".75"/><stop offset=".82" stop-color="#B28BFF" stop-opacity=".88"/><stop offset="1" stop-color="#B28BFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="waveBlue" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DA8FF" stop-opacity=".04"/><stop offset=".28" stop-color="#7DA8FF" stop-opacity=".72"/><stop offset=".66" stop-color="#5BE2D0" stop-opacity=".84"/><stop offset="1" stop-color="#5BE2D0" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 180 -540 0 720 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5376B8" stop-opacity=".18"/><stop offset="1" stop-color="#5376B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="538" y1="143" x2="897" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6FCFF" stop-opacity=".24"/><stop offset=".4" stop-color="#DDEEFF" stop-opacity=".12"/><stop offset=".72" stop-color="#BDD9FF" stop-opacity=".08"/><stop offset="1" stop-color="#E4F7FF" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="510" y1="143" x2="930" y2="217" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".76"/><stop offset=".32" stop-color="#C5E8FF" stop-opacity=".34"/><stop offset=".7" stop-color="#D5D7FF" stop-opacity=".4"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".68"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="720" y1="143" x2="720" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".36"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity=".1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glassRefraction" cx="0" cy="0" r="1" gradientTransform="matrix(142 0 0 34 604 154)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".25"/><stop offset="1" stop-color="#B9DEFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glassBlur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-60%" width="140%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#020713" flood-opacity=".6" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="glassClip"><rect x="510" y="143" width="420" height="74" rx="37"/></clipPath>
    <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1440" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1440" height="360" fill="url(#bg)"/>
    <rect width="1440" height="360" fill="url(#glow)"/>

    <g filter="url(#softGlow)" opacity=".9">
      <g>
        <path d="M-1440 103C-1260 39-1080 39-900 103S-540 167-360 103 0 39 180 103s360 64 540 0 360-64 540 0 360 64 540 0 360-64 540 0" stroke="url(#waveMint)" stroke-width="2.6"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-720 0" dur="36s" repeatCount="indefinite"/>
      </g>
      <g opacity=".85">
        <path d="M-1440 257C-1260 321-1080 321-900 257s360-64 540 0 360 64 540 0 360-64 540 0 360 64 540 0 360-64 540 0" stroke="url(#waveBlue)" stroke-width="2.2"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;720 0" dur="43s" repeatCount="indefinite"/>
      </g>
    </g>

    <g opacity=".58">
      <path d="M0 74C150 40 270 40 420 74s270 34 420 0 270-34 420 0 270 34 420 0" stroke="#61E7D0" stroke-width="1"/>
      <path d="M0 286c150 34 270 34 420 0s270-34 420 0 270 34 420 0 270-34 420 0" stroke="#958CFF" stroke-width="1"/>
    </g>

    <g>
      <animateMotion dur="28s" repeatCount="indefinite" path="M0 0 C7 -6 14 -3 12 2 C10 8 1 9 -5 7 C-13 4 -13 -4 -7 -7 C-2 -9 4 -5 0 0"/>
      <rect x="506" y="139" width="428" height="82" rx="41" fill="#85CFFF" fill-opacity=".2" filter="url(#glassBlur)"/>
      <g filter="url(#glassShadow)">
        <rect x="510" y="143" width="420" height="74" rx="37" fill="url(#glass)" stroke="url(#glassEdge)" stroke-width="1.25"/>
        <g clip-path="url(#glassClip)">
          <ellipse cx="604" cy="154" rx="142" ry="34" fill="url(#glassRefraction)"/>
          <ellipse cx="852" cy="218" rx="118" ry="27" fill="#A898FF" fill-opacity=".1" filter="url(#glassBlur)"/>
          <path d="M548 144.5h344c19.3 0 35 15.7 35 35v1.5H513v-1.5c0-19.3 15.7-35 35-35Z" fill="url(#glassShine)"/>
        </g>
        <path d="M540 147.5c58-3 302-3 360 0" stroke="#FFFFFF" stroke-opacity=".58" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M535 202.5c45 8 325 8 370 0" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="1" stroke-linecap="round"/>
        <rect x="511" y="144" width="418" height="72" rx="36" stroke="#FFFFFF" stroke-opacity=".16"/>
        <text x="720" y="194" text-anchor="middle" fill="#F4FAF8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="46" font-weight="600" letter-spacing="1.2">liltaket</text>
      </g>
    </g>
  </g>
</svg>
