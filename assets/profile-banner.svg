<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D13"/><stop offset=".5" stop-color="#0B111B"/><stop offset="1" stop-color="#10101B"/>
    </linearGradient>
    <linearGradient id="waveMint" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46F0C4" stop-opacity=".05"/><stop offset=".22" stop-color="#46F0C4" stop-opacity=".92"/><stop offset=".53" stop-color="#75DFF5" stop-opacity=".75"/><stop offset=".82" stop-color="#B28BFF" stop-opacity=".88"/><stop offset="1" stop-color="#B28BFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="waveBlue" x1="0" y1="0" x2="1440" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DA8FF" stop-opacity=".04"/><stop offset=".28" stop-color="#7DA8FF" stop-opacity=".72"/><stop offset=".66" stop-color="#5BE2D0" stop-opacity=".84"/><stop offset="1" stop-color="#5BE2D0" stop-opacity=".06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 180 -540 0 720 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5376B8" stop-opacity=".18"/><stop offset="1" stop-color="#5376B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="525" y1="145" x2="915" y2="219" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7F6FF" stop-opacity=".18"/><stop offset=".46" stop-color="#D5E8FF" stop-opacity=".1"/><stop offset="1" stop-color="#B9D6FF" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="510" y1="143" x2="930" y2="217" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".56"/><stop offset=".48" stop-color="#C5E8FF" stop-opacity=".22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="glassShine" x1="720" y1="143" x2="720" y2="177" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".24"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1440" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1440" height="360" fill="url(#bg)"/>
    <rect width="1440" height="360" fill="url(#glow)"/>

    <g filter="url(#softGlow)" opacity=".9">
      <g>
