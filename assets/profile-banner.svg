<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D11"/><stop offset=".55" stop-color="#101820"/><stop offset="1" stop-color="#11131B"/>
    </linearGradient>
    <linearGradient id="route" x1="875" y1="90" x2="1270" y2="294" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DF4D3" stop-opacity=".18"/><stop offset=".32" stop-color="#7DF4D3" stop-opacity=".8"/><stop offset=".7" stop-color="#73B9FF" stop-opacity=".9"/><stop offset="1" stop-color="#B18CFF" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="prop" x1="0" y1="-10" x2="0" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C5FFF3" stop-opacity=".38"/><stop offset="1" stop-color="#7BE8D2" stop-opacity=".04"/>
    </linearGradient>
    <radialGradient id="haze" cx="0" cy="0" r="1" gradientTransform="matrix(410 0 0 210 1060 188)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F8B9F" stop-opacity=".12"/><stop offset="1" stop-color="#3F8B9F" stop-opacity="0"/>
    </radialGradient>
    <filter id="droneGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1440" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1440" height="360" fill="url(#bg)"/>
    <rect width="1440" height="360" fill="url(#haze)"/>

    <!-- Quiet technical grid and horizon marks -->
    <path d="M0 300H1440M0 60H1440" stroke="#B7D6E1" stroke-opacity=".055"/>
    <path d="M720 0V360M1080 0V360" stroke="#B7D6E1" stroke-opacity=".035" stroke-dasharray="2 12"/>
    <path d="M100 286h80m12 0h8m12 0h24" stroke="#9CB8BE" stroke-opacity=".18" stroke-width="1"/>

    <!-- One continuous racing line, with moving dashes to suggest flight -->
    <path d="M1080 90C1190 90 1270 130 1270 196C1270 256 1190 294 1085 292C975 290 890 258 875 200C860 140 970 90 1080 90Z" stroke="#B8D4DB" stroke-opacity=".09" stroke-width="1"/>
    <path d="M1080 90C1190 90 1270 130 1270 196C1270 256 1190 294 1085 292C975 290 890 258 875 200C860 140 970 90 1080 90Z" stroke="url(#route)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2 14">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="24s" repeatCount="indefinite"/>
    </path>

    <!-- Small racing gates -->
    <g opacity=".48" transform="rotate(-11 1018 157)">
      <rect x="997" y="137" width="42" height="42" rx="2" stroke="#72DCCD" stroke-width="1.2"/>
      <path d="M1004 144h28v28h-28z" stroke="#72DCCD" stroke-opacity=".35" stroke-dasharray="2 5"/>
    </g>
    <g opacity=".42" transform="rotate(13 1223 232)">
      <rect x="1202" y="211" width="42" height="42" rx="2" stroke="#A68FFF" stroke-width="1.2"/>
      <path d="M1209 218h28v28h-28z" stroke="#A68FFF" stroke-opacity=".35" stroke-dasharray="2 5"/>
    </g>

    <!-- A compact top-down 5-inch X-frame FPV racer -->
    <g filter="url(#droneGlow)">
      <animateMotion dur="36s" rotate="auto" repeatCount="indefinite" path="M1080 90C1190 90 1270 130 1270 196C1270 256 1190 294 1085 292C975 290 890 258 875 200C860 140 970 90 1080 90Z"/>
      <g>
        <!-- translucent prop disks; four separate motors on a true X frame -->
        <ellipse cx="-24" cy="-18" rx="11" ry="4.2" transform="rotate(-38 -24 -18)" fill="url(#prop)" stroke="#9AF4E2" stroke-opacity=".35" stroke-width=".8"/>
        <ellipse cx="24" cy="-18" rx="11" ry="4.2" transform="rotate(38 24 -18)" fill="url(#prop)" stroke="#9AF4E2" stroke-opacity=".35" stroke-width=".8"/>
        <ellipse cx="-24" cy="18" rx="11" ry="4.2" transform="rotate(38 -24 18)" fill="url(#prop)" stroke="#9AF4E2" stroke-opacity=".35" stroke-width=".8"/>
        <ellipse cx="24" cy="18" rx="11" ry="4.2" transform="rotate(-38 24 18)" fill="url(#prop)" stroke="#9AF4E2" stroke-opacity=".35" stroke-width=".8"/>
        <!-- carbon arms -->
        <path d="M-5-4-21-17l-5 5L-7 5M5-4 21-17l5 5L7 5M-5 4-21 17l-5-5L-7-5M5 4 21 17l5-5L7-5" fill="#172126" stroke="#93AEB3" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M-6-4 0 2 6-4M-6 4 0-2 6 4" stroke="#C7D5D5" stroke-opacity=".65" stroke-width="1.4" stroke-linecap="round"/>
        <!-- four motor bells -->
        <circle cx="-24" cy="-18" r="4.2" fill="#121A20" stroke="#70E7D1" stroke-width="1.4"/>
        <circle cx="24" cy="-18" r="4.2" fill="#121A20" stroke="#70E7D1" stroke-width="1.4"/>
        <circle cx="-24" cy="18" r="4.2" fill="#121A20" stroke="#9E91FF" stroke-width="1.2"/>
        <circle cx="24" cy="18" r="4.2" fill="#121A20" stroke="#9E91FF" stroke-width="1.2"/>
        <circle cx="-24" cy="-18" r="1.2" fill="#E7FFF9"/><circle cx="24" cy="-18" r="1.2" fill="#E7FFF9"/>
        <!-- compact battery, stack and forward FPV camera; nose points up -->
        <path d="M-7-12 0-17 7-12 6 9 0 13-6 9Z" fill="#28373D" stroke="#D0E1DF" stroke-width="1.1"/>
        <rect x="-4.3" y="-6" width="8.6" height="12" rx="2" fill="#97D96C" fill-opacity=".75"/>
        <path d="M-7 1h14M-5 8h10" stroke="#D6E2DF" stroke-opacity=".68" stroke-width="1"/>
        <path d="M-3.2-14.2 0-16.8l3.2 2.6-1.1 3.2h-4.2Z" fill="#11191E" stroke="#9DEFE0" stroke-width=".9"/>
        <circle cx="0" cy="-13" r="1.2" fill="#7CF2DC"/>
        <path d="M-2 14v4m4-4v4" stroke="#B28CFF" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Static, deliberately anchored name -->
    <path d="M132 123h38" stroke="#76E5D0" stroke-width="2" stroke-linecap="round"/>
    <text x="130" y="190" fill="#EFF5F3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="52" font-weight="520" letter-spacing="-1.8">liltaket</text>
    <path d="M130 219h296" stroke="#D0E0E2" stroke-opacity=".13"/>
    <circle cx="130" cy="219" r="2" fill="#76E5D0"/>
  </g>
</svg>
