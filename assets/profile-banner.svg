<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1440" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F2EC"/><stop offset=".58" stop-color="#EAEAE5"/><stop offset="1" stop-color="#E4E8E5"/>
    </linearGradient>
    <linearGradient id="air" x1="820" y1="75" x2="1360" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5D8CB" stop-opacity="0"/><stop offset=".46" stop-color="#83BDB2" stop-opacity=".5"/><stop offset="1" stop-color="#AFC3DB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="speed" x1="-50" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E88152" stop-opacity="0"/><stop offset="1" stop-color="#E88152" stop-opacity=".68"/>
    </linearGradient>
    <radialGradient id="sunwash" cx="0" cy="0" r="1" gradientTransform="matrix(400 0 0 230 1110 174)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8DBD1" stop-opacity=".34"/><stop offset="1" stop-color="#B8DBD1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feOffset in="blur" dx="1" dy="3" result="offset"/>
      <feFlood flood-color="#24312F" flood-opacity=".24" result="shade"/>
      <feComposite in="shade" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1440" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1440" height="360" fill="url(#paper)"/>
    <rect width="1440" height="360" fill="url(#sunwash)"/>

    <!-- Open, airy flight marks. These are not a circuit or a track. -->
    <path d="M770 270C897 244 949 193 1035 151C1132 103 1249 95 1374 112" stroke="url(#air)" stroke-width="1.4"/>
    <path d="M818 90C943 112 1022 156 1116 212C1196 260 1281 283 1370 278" stroke="#93ADA7" stroke-opacity=".2" stroke-width="1"/>
    <path d="M914 320C1010 291 1065 276 1139 264" stroke="#D4A286" stroke-opacity=".28" stroke-width="1"/>
    <circle cx="1340" cy="74" r="2" fill="#DB8058" fill-opacity=".55"/>
    <circle cx="872" cy="131" r="1.5" fill="#6C9E91" fill-opacity=".6"/>

    <!-- A small five inch FPV quad, viewed from above. -->
    <g filter="url(#shadow)">
      <animateMotion dur="34s" rotate="auto" repeatCount="indefinite" path="M1060 93C1188 93 1290 132 1290 180C1290 228 1188 267 1060 267C932 267 850 228 850 180C850 132 932 93 1060 93Z"/>
      <g>
        <!-- light, fast prop discs -->
        <ellipse cx="20" cy="-20" rx="10.5" ry="3.3" transform="rotate(-26 20 -20)" fill="#D8E9E3" fill-opacity=".86" stroke="#74847F" stroke-opacity=".58" stroke-width=".8"/>
        <ellipse cx="20" cy="20" rx="10.5" ry="3.3" transform="rotate(26 20 20)" fill="#D8E9E3" fill-opacity=".86" stroke="#74847F" stroke-opacity=".58" stroke-width=".8"/>
        <ellipse cx="-20" cy="-20" rx="10.5" ry="3.3" transform="rotate(26 -20 -20)" fill="#D8E9E3" fill-opacity=".86" stroke="#74847F" stroke-opacity=".58" stroke-width=".8"/>
        <ellipse cx="-20" cy="20" rx="10.5" ry="3.3" transform="rotate(-26 -20 20)" fill="#D8E9E3" fill-opacity=".86" stroke="#74847F" stroke-opacity=".58" stroke-width=".8"/>
        <!-- true X frame and carbon arms -->
        <path d="M-5-4-18-19M-5 4-18 19M5-4 18-19M5 4 18 19" stroke="#303A3A" stroke-width="5.2" stroke-linecap="round"/>
        <path d="M-5-4-18-19M-5 4-18 19M5-4 18-19M5 4 18 19" stroke="#63716E" stroke-opacity=".62" stroke-width="1" stroke-linecap="round"/>
        <!-- four distinct motor bells -->
        <circle cx="-20" cy="-20" r="4.2" fill="#273130" stroke="#485956" stroke-width="1.1"/>
        <circle cx="-20" cy="20" r="4.2" fill="#273130" stroke="#485956" stroke-width="1.1"/>
        <circle cx="20" cy="-20" r="4.2" fill="#273130" stroke="#DA7952" stroke-width="1.5"/>
        <circle cx="20" cy="20" r="4.2" fill="#273130" stroke="#DA7952" stroke-width="1.5"/>
        <circle cx="-20" cy="-20" r="1.15" fill="#D7E6E1"/><circle cx="-20" cy="20" r="1.15" fill="#D7E6E1"/>
        <circle cx="20" cy="-20" r="1.15" fill="#FFB18A"/><circle cx="20" cy="20" r="1.15" fill="#FFB18A"/>
        <!-- narrow body, forward camera, flight stack and battery -->
        <path d="M-12-5-4-8 8-7 15-3 15 3 8 7-4 8-12 5Z" fill="#35413F" stroke="#202A29" stroke-width="1.2"/>
        <path d="M-8-4 6-4 9 0 6 4-8 4Z" fill="#B2B887"/>
        <path d="M-6-5v10M1-5v10" stroke="#48524C" stroke-width="1"/>
        <path d="M12-3 20 0 12 3Z" fill="#D8754D" stroke="#A75537" stroke-width=".8"/>
        <circle cx="16" cy="0" r="1.35" fill="#F7E7CF"/>
        <path d="M-12 0h-8" stroke="#505F5B" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M-15-2v4" stroke="#D8754D" stroke-width="1.2" stroke-linecap="round"/>
      </g>
      <!-- short speed accents follow the airframe, not a drawn racing lane -->
      <path d="M-35-7h-18M-36 0h-25M-35 7h-18" stroke="url(#speed)" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Static name, aligned to one clear left margin. -->
    <path d="M132 124h34" stroke="#D8754D" stroke-width="2" stroke-linecap="round"/>
    <text x="130" y="190" fill="#202B2A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="54" font-weight="560" letter-spacing="-1.8">liltaket</text>
    <path d="M130 219h278" stroke="#52625E" stroke-opacity=".22"/>
    <circle cx="130" cy="219" r="2" fill="#D8754D"/>
  </g>
</svg>
